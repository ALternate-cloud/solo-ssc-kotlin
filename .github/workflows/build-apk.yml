name: Build Solo Leveling Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoloLeveling-SSC-Prep-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Auto-Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          gh release create latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Solo Leveling SSC Prep (Latest APK)" \
            --notes "⚡ Direct download APK for Solo Leveling SSC Prep. Tap app-debug.apk to download and install!"

      - name: Summary
        run: |
          echo "### Android APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Download **SoloLeveling-SSC-Prep-APK** directly from [GitHub Releases](https://github.com/ALternate-cloud/solo-ssc-kotlin/releases/latest) or from the Artifacts below." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Direct Download Link:**" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/ALternate-cloud/solo-ssc-kotlin/releases/download/latest/app-debug.apk" >> $GITHUB_STEP_SUMMARY
